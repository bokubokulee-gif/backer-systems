  <text class="green" x="982" y="447" text-anchor="middle" data-i18n="s079">已判定结果</text>
  <path class="feedback" d="M890 442h-58"/>
  <rect class="node next" x="636" y="426" width="196" height="32"/>
  <text class="amber" x="734" y="447" text-anchor="middle" data-i18n="s080">校准 → 策略</text>
  <path class="feedback" d="M636 442H228V194h252v-14"/>
  <rect x="268" y="430" width="326" height="23" fill="#08080a"/>
  <text class="amber" x="431" y="447" text-anchor="middle" data-i18n="s081">验证路径 · 规划中</text>
</svg>