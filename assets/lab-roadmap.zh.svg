<svg lang="zh-Hans" xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title" data-i18n="s057">Backer AI Lab：仿真架构与上线前市场实验</title>
  <desc id="desc" data-i18n="s058">两条相连的技术流程：带来源时间的上下文与合成人物画像驱动记忆、检索、反思、规划及行动循环；固定群体后，以留出行为数据评估。同一群体分别进行基准、手续费变更、流动性变更及信息冲击四种配对实验。资金约束下的订单簿回放产出市场质量指标，用于上线评审。虚线所示的规划验证路径，将外部判定结果经校准反馈至智能体策略。实线节点表示原型组件，虚线节点表示后续研究。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="#a7a5a1"/></marker>
    <marker id="amber-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="#e9bd86"/></marker>
    <marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="#00dd94"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f5f3ee;font-size:14px}
      .lane{font-size:16px;font-weight:600;letter-spacing:1px}
      .heading{font-size:16px;font-weight:600}
      .muted{fill:#aba9a5}
      .amber{fill:#e9bd86}
      .green{fill:#00dd94}
      .node{fill:#111113;stroke:#5c5a57;stroke-width:1.2;rx:3}
      .policy{fill:#171410;stroke:#e9bd86;stroke-width:1.2;rx:4}
      .next{stroke-dasharray:5 4}
      .flow{fill:none;stroke:#a7a5a1;stroke-width:1.3;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#777672;stroke-width:1.2}
      .cohort{fill:none;stroke:#e9bd86;stroke-width:1.3;marker-end:url(#amber-arrow)}
      .feedback{fill:none;stroke:#e9bd86;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#amber-arrow)}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#08080a"/>

  <text class="lane amber" x="24" y="29" data-i18n="s027">(a) 构建仿真系统</text>
  <path d="M855 24h27" stroke="#aba9a5" stroke-width="1.4"/>
  <text class="muted" x="891" y="29" data-i18n="s055">原型</text>
  <path d="M997 24h27" stroke="#aba9a5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="muted" x="1033" y="29" data-i18n="s056">后续研究</text>

  <rect class="node" x="24" y="53" width="180" height="52"/>
  <text class="heading" x="38" y="76" data-i18n="s059">带时间的上下文</text>
  <text class="muted" x="38" y="95" data-i18n="s060">曝光 · 选择</text>
  <rect class="node" x="24" y="123" width="180" height="57"/>
  <text class="heading" x="38" y="146" data-i18n="s061">合成人物画像</text>
  <text class="muted" x="38" y="167" data-i18n="s062">授权群体：下一步</text>
  <path class="branch" d="M204 79h16v72h-16"/>
  <path class="flow" d="M220 116h20"/>

  <rect class="policy" x="240" y="53" width="480" height="127"/>
  <text class="heading amber" x="257" y="78" data-i18n="s031">行为策略 πθ</text>
  <text class="muted" x="474" y="78" data-i18n="s063">状态 + 记忆 + 约束</text>
  <rect class="node" x="256" y="99" width="94" height="39"/>
  <text x="303" y="124" text-anchor="middle" data-i18n="s032">记忆</text>
  <rect class="node" x="366" y="99" width="94" height="39"/>
  <text x="413" y="124" text-anchor="middle" data-i18n="s033">检索</text>
  <rect class="node" x="476" y="99" width="94" height="39"/>
  <text x="523" y="124" text-anchor="middle" data-i18n="s034">反思</text>
  <rect class="node" x="586" y="99" width="118" height="39"/>
  <text x="645" y="124" text-anchor="middle" data-i18n="s035">规划 / 行动</text>
  <path class="flow" d="M350 119h16"/>
  <path class="flow" d="M460 119h16"/>
  <path class="flow" d="M570 119h16"/>
  <path class="flow" d="M645 138v24H303v-24"/>
  <rect x="385" y="150" width="177" height="22" fill="#171410"/>
  <text class="muted" x="474" y="166" text-anchor="middle" data-i18n="s064">经验 → 记忆</text>

  <path class="flow" d="M720 117h38"/>
  <rect class="node" x="758" y="68" width="170" height="96"/>
  <text class="heading" x="843" y="96" text-anchor="middle" data-i18n="s036">固定智能体群体</text>
  <text class="muted" x="843" y="121" text-anchor="middle" data-i18n="s065">同群体 · 同种子</text>
  <text class="muted" x="843" y="144" text-anchor="middle" data-i18n="s066">预算 · 先验</text>
  <path class="flow next" d="M928 117h41"/>
  <rect class="node next" x="969" y="68" width="207" height="96"/>
  <text class="heading" x="1072.5" y="96" text-anchor="middle" data-i18n="s038">留出验证</text>
  <text class="muted" x="1072.5" y="121" text-anchor="middle" data-i18n="s039">行为 · 校准</text>
  <text class="muted" x="1072.5" y="144" text-anchor="middle" data-i18n="s067">按群体 / 时间留出</text>

  <path class="flow next" d="M1072 164v127"/>
  <text class="muted" x="1085" y="230" data-i18n="s068">验证</text>
  <path class="cohort" d="M843 164v47H244v83"/>
  <rect x="418" y="200" width="299" height="22" fill="#08080a"/>
  <text class="amber" x="567.5" y="216" text-anchor="middle" data-i18n="s069">固定群体，只改一项条件。</text>

  <text class="lane amber" x="24" y="249" data-i18n="s040">(b) 测试市场机制</text>
  <text class="muted" x="272" y="273" data-i18n="s070">配对实验</text>
  <rect class="node" x="24" y="291" width="180" height="100"/>
  <text class="heading" x="38" y="320" data-i18n="s041">候选合约</text>
  <text class="muted" x="38" y="345" data-i18n="s071">规则 · 费率 · 期限</text>
  <text class="muted" x="38" y="369" data-i18n="s072">客观结果判定</text>
  <path class="branch" d="M204 341h40M244 296v93"/>
  <path class="flow" d="M244 296h27"/>
  <path class="flow" d="M244 327h27"/>
  <path class="flow" d="M244 358h27"/>
  <path class="flow" d="M244 389h27"/>
  <rect class="node" x="271" y="284" width="152" height="25"/>
  <text x="347" y="302" text-anchor="middle" data-i18n="s043">基准</text>
  <rect class="node" x="271" y="315" width="152" height="25"/>
  <text x="347" y="333" text-anchor="middle" data-i18n="s044">Δ 手续费</text>
  <rect class="node" x="271" y="346" width="152" height="25"/>
  <text x="347" y="364" text-anchor="middle" data-i18n="s045">Δ 流动性</text>
  <rect class="node" x="271" y="377" width="152" height="25"/>
  <text x="347" y="395" text-anchor="middle" data-i18n="s046">信息冲击</text>
  <path class="branch" d="M423 296h24v93h-24M423 327h24M423 358h24"/>
  <path class="flow" d="M447 341h48"/>

  <rect x="495" y="291" width="196" height="100" rx="3" fill="#0b1914" stroke="#00dd94" stroke-width="1.2"/>
  <text class="heading green" x="593" y="320" text-anchor="middle" data-i18n="s047">订单簿回放</text>
  <text class="muted" x="593" y="345" text-anchor="middle" data-i18n="s073">资金约束 · 成交</text>
  <text class="muted" x="593" y="369" text-anchor="middle" data-i18n="s074">价时优先 · 现金 · 持仓</text>
  <path class="flow" d="M691 341h43"/>
  <rect class="node" x="734" y="291" width="186" height="100"/>
  <text class="heading" x="827" y="320" text-anchor="middle" data-i18n="s049">比较结果</text>
  <text class="muted" x="827" y="345" text-anchor="middle" data-i18n="s075">深度 · 价差 · 换手</text>
  <text class="muted" x="827" y="369" text-anchor="middle" data-i18n="s076">滑点 · 集中度</text>
  <path class="flow next" d="M920 341h45"/>
  <rect class="node next" x="965" y="291" width="211" height="100"/>
  <text class="heading" x="1070.5" y="320" text-anchor="middle" data-i18n="s051">上线评审</text>
  <text class="muted" x="1070.5" y="345" text-anchor="middle" data-i18n="s077">完整性 · 压测 · 有效性</text>
  <text class="muted" x="1070.5" y="369" text-anchor="middle" data-i18n="s078">通过 / 修订 / 否决</text>

  <path class="feedback" d="M1071 391v20h-89v15"/>
