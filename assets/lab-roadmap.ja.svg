  <rect x="495" y="291" width="196" height="100" rx="3" fill="#0b1914" stroke="#00dd94" stroke-width="1.2"/>
  <text class="heading green" x="593" y="320" text-anchor="middle" data-i18n="s047">注文板を再現実行</text>
  <text class="muted" x="593" y="345" text-anchor="middle" data-i18n="s073">資金確保 · 約定</text>
  <text class="muted" x="593" y="369" text-anchor="middle" data-i18n="s074">価格・時間 · 資金 · 数量</text>
  <path class="flow" d="M691 341h43"/>
