  <text class="heading" x="38" y="320" data-i18n="s041">출시 후보 계약</text>
  <text class="muted" x="38" y="345" data-i18n="s071">규칙 · 수수료 · 기간</text>
  <text class="muted" x="38" y="369" data-i18n="s072">객관적 결과 판정</text>
