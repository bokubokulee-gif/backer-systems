  <path d="M855 24h27" stroke="#aba9a5" stroke-width="1.4"/>
  <text class="muted" x="891" y="29" data-i18n="s055">프로토타입</text>
  <path d="M997 24h27" stroke="#aba9a5" stroke-width="1.4" stroke-dasharray="5 4"/>
