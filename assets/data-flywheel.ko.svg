    <text class="number" x="428.96" y="130.00" style="fill:#e9bd86">02</text>
    <text class="label" x="428.96" y="161.00" style="font-size:22px" data-i18n="s010">의사결정</text>
    <text class="label" x="428.96" y="186.00" style="font-size:22px" data-i18n="s011">모의실험</text>
  </g>
