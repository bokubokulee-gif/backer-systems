    <circle cx="280.00" cy="417.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="280.00" y="388.00" style="fill:#e9bd86">04</text>
    <text class="label" x="280.00" y="419.00" style="font-size:22px" data-i18n="h159">기록</text>
    <text class="label" x="280.00" y="444.00" style="font-size:22px" data-i18n="s016">행동 이력</text>
  </g>
  <g aria-label="05 결과 확정" data-i18n-aria-label="s017">
    <circle cx="131.04" cy="331.00" r="64" fill="#0b1a14" stroke="#00dd94" stroke-width="1.4"/>
    <text class="number" x="131.04" y="302.00" style="fill:#00dd94">05</text>
    <text class="label" x="131.04" y="333.00" style="font-size:22px" data-i18n="s018">결과</text>
    <text class="label" x="131.04" y="358.00" style="font-size:22px" data-i18n="s019">확정</text>
  </g>
  <g aria-label="06 모델 보정" data-i18n-aria-label="s020">
    <circle cx="131.04" cy="159.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="131.04" y="130.00" style="fill:#e9bd86">06</text>
    <text class="label" x="131.04" y="161.00" style="font-size:22px" data-i18n="s021">모델</text>
    <text class="label" x="131.04" y="186.00" style="font-size:22px" data-i18n="s022">보정</text>
  </g>
  <text class="foot" x="280" y="510" data-i18n="s023">제안된 순환 · 외부 결과를 기준으로 학습합니다.</text>
  <text class="foot" x="280" y="533" data-i18n="s024">합성 활동만으로는 새로운 근거가 생기지 않습니다.</text>
