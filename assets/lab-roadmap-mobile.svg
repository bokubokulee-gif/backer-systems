<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1032" viewBox="0 0 420 1032" role="img" aria-labelledby="title desc">
  <title id="title" data-i18n="s025">Backer AI Lab technical roadmap</title>
  <desc id="desc" data-i18n="s026">A mobile diagram of two connected processes. First, source-dated context and synthetic personas feed an agent policy loop: memory, retrieve, reflect, plan and act. The population is frozen and held-out behavior is checked. Second, the same population tests a candidate contract through four parallel scenarios: baseline, changed fees, changed liquidity and an information shock. Order-book replay leads to outcome comparison and a launch gate. A planned validation path returns resolved external outcomes through calibration to the agent policy. Solid outlines mean prototype; dashed outlines mean research next.</desc>
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#a7a5a1"/></marker>
    <marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#e9bd86"/></marker>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#00dd94"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#f5f3ee}
      .lane{font-size:16px;font-weight:600;letter-spacing:.8px}
      .heading{font-size:17px;font-weight:600}
      .muted{fill:#aba9a5}
      .amber{fill:#e9bd86}
      .green{fill:#00dd94}
      .node{fill:#111113;stroke:#5c5a57;stroke-width:1.2;rx:3}
      .next{stroke-dasharray:5 4}
      .flow{fill:none;stroke:#a7a5a1;stroke-width:1.3;marker-end:url(#a)}
      .branch{fill:none;stroke:#777672;stroke-width:1.2}
      .cohort{fill:none;stroke:#e9bd86;stroke-width:1.3;marker-end:url(#b)}
      .feedback{fill:none;stroke:#00dd94;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="420" height="1032" fill="#08080a"/>
  <text class="lane amber" x="24" y="29" data-i18n="s027">(a) BUILD THE SIMULATOR</text>

  <rect class="node" x="24" y="48" width="372" height="86"/>
  <text class="heading" x="40" y="74" data-i18n="s028">Context + personas</text>
  <text class="muted" x="40" y="99" data-i18n="s029">Source-dated context · synthetic agents</text>
  <text class="muted" x="40" y="122" data-i18n="s030">Consented cohorts: research next</text>
  <path class="flow" d="M210 134v20"/>

  <rect x="24" y="154" width="372" height="136" rx="4" fill="#171410" stroke="#e9bd86" stroke-width="1.2"/>
  <text class="heading amber" x="40" y="179" data-i18n="s031">Behavioral policy πθ</text>
  <rect class="node" x="44" y="194" width="138" height="36"/>
  <text x="113" y="218" text-anchor="middle" data-i18n="s032">Memory</text>
  <rect class="node" x="238" y="194" width="138" height="36"/>
  <text x="307" y="218" text-anchor="middle" data-i18n="s033">Retrieve</text>
  <rect class="node" x="238" y="247" width="138" height="36"/>
  <text x="307" y="271" text-anchor="middle" data-i18n="s034">Reflect</text>
  <rect class="node" x="44" y="247" width="138" height="36"/>
  <text x="113" y="271" text-anchor="middle" data-i18n="s035">Plan / act</text>
  <path class="flow" d="M182 212h56"/>
  <path class="flow" d="M307 230v17"/>
  <path class="flow" d="M238 265h-56"/>
  <path class="flow" d="M113 247v-17"/>
  <path class="flow" d="M210 290v12H113v12"/>

  <rect class="node" x="24" y="314" width="178" height="76"/>
  <text class="heading" x="113" y="341" text-anchor="middle" data-i18n="s036">Freeze population</text>
  <text class="muted" x="113" y="367" text-anchor="middle" data-i18n="s037">Same agents / seeds</text>
  <path class="flow next" d="M202 352h16"/>
  <rect class="node next" x="218" y="314" width="178" height="76"/>
  <text class="heading" x="307" y="341" text-anchor="middle" data-i18n="s038">Held-out checks</text>
  <text class="muted" x="307" y="367" text-anchor="middle" data-i18n="s039">Behavior · calibration</text>
  <path class="flow next" d="M396 352h16v509h-16"/>
  <path class="cohort" d="M113 390v16h237v49"/>

  <text class="lane amber" x="24" y="433" data-i18n="s040">(b) TEST A MARKET</text>
  <rect class="node" x="24" y="455" width="372" height="62"/>
  <text class="heading" x="40" y="481" data-i18n="s041">Candidate contract</text>
  <text class="muted" x="40" y="506" data-i18n="s042">Rules · fees · horizon · resolution</text>

  <path class="branch" d="M210 517v88"/>
  <path class="flow" d="M210 557h-15"/>
  <path class="flow" d="M210 557h15"/>
  <path class="flow" d="M210 605h-15"/>
  <path class="flow" d="M210 605h15"/>
  <rect class="node" x="32" y="540" width="163" height="34"/>
  <text x="113.5" y="563" text-anchor="middle" data-i18n="s043">Baseline</text>
  <rect class="node" x="225" y="540" width="163" height="34"/>
  <text x="306.5" y="563" text-anchor="middle" data-i18n="s044">Δ Fees</text>
  <rect class="node" x="32" y="588" width="163" height="34"/>
  <text x="113.5" y="611" text-anchor="middle" data-i18n="s045">Δ Liquidity</text>
  <rect class="node" x="225" y="588" width="163" height="34"/>
  <text x="306.5" y="611" text-anchor="middle" data-i18n="s046">Information shock</text>
  <path class="branch" d="M32 557H20v87h380v-87h-12M32 605H20M388 605h12"/>
  <path class="flow" d="M210 644v17"/>

  <rect x="24" y="661" width="372" height="62" rx="3" fill="#0b1914" stroke="#00dd94" stroke-width="1.2"/>
  <text class="heading green" x="40" y="687" data-i18n="s047">Order-book replay</text>
  <text class="muted" x="40" y="712" data-i18n="s048">Funded agents · price–time · fills</text>
  <path class="flow" d="M210 723v21"/>
  <rect class="node" x="24" y="744" width="372" height="62"/>
  <text class="heading" x="40" y="770" data-i18n="s049">Compare outcomes</text>
  <text class="muted" x="40" y="795" data-i18n="s050">Depth · spread · slippage · concentration</text>
  <path class="flow next" d="M210 806v21"/>
  <rect class="node next" x="24" y="827" width="372" height="68"/>
  <text class="heading" x="40" y="853" data-i18n="s051">Launch gate</text>
  <text class="muted" x="40" y="879" data-i18n="s052">Integrity → stress → validity</text>
  <path class="feedback" d="M210 895v23"/>
  <rect class="node next" x="24" y="918" width="372" height="62"/>
  <text class="heading green" x="40" y="944" data-i18n="s053">Resolve → recalibrate → policy</text>
  <text class="muted" x="40" y="969" data-i18n="s054">External outcomes · planned validation</text>
  <path class="feedback" d="M24 949H8V179h16"/>

  <path d="M24 1009h25" stroke="#aba9a5" stroke-width="1.4"/>
  <text class="muted" x="60" y="1014" data-i18n="s055">Prototype</text>
  <path d="M199 1009h25" stroke="#aba9a5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="muted" x="235" y="1014" data-i18n="s056">Research next</text>
</svg>