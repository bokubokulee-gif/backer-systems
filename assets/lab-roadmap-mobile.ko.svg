  <text class="heading" x="40" y="74" data-i18n="s028">맥락 + 페르소나</text>
  <text class="muted" x="40" y="99" data-i18n="s029">출처 시각 기록 · 합성 에이전트</text>
  <text class="muted" x="40" y="122" data-i18n="s030">동의 기반 코호트: 다음 연구</text>
