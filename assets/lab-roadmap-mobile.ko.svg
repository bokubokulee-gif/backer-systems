<svg lang="ko-KR" xmlns="http://www.w3.org/2000/svg" width="420" height="1032" viewBox="0 0 420 1032" role="img" aria-labelledby="title desc">
  <title id="title" data-i18n="s025">Backer AI Lab 기술 로드맵</title>
  <desc id="desc" data-i18n="s026">연결된 두 과정을 보여주는 모바일 도식입니다. 첫째, 출처 시각이 기록된 맥락과 합성 페르소나가 기억, 검색, 성찰, 계획, 행동의 에이전트 정책 순환에 입력됩니다. 집단을 고정하고 홀드아웃 행동을 검증합니다. 둘째, 같은 집단이 출시 후보 계약을 기준 조건, 수수료 변경, 유동성 변경, 정보 충격의 네 병렬 시나리오로 시험합니다. 호가장 재실행 뒤 결과 비교와 출시 기준 평가를 진행합니다. 계획된 검증 경로에서는 외부에서 확정된 결과를 보정에 활용해 에이전트 정책에 반영합니다. 실선은 프로토타입, 점선은 다음 연구 단계를 뜻합니다.</desc>
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#a7a5a1"/></marker>
    <marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#e9bd86"/></marker>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#00dd94"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;fill:#f5f3ee}
      .lane{font-size:16px;font-weight:600;letter-spacing:.8px}
      .heading{font-size:17px;font-weight:600}
      .muted{fill:#aba9a5}
      .amber{fill:#e9bd86}
      .green{fill:#00dd94}
      .node{fill:#111113;stroke:#5c5a57;stroke-width:1.2;rx:3}
      .next{stroke-dasharray:5 4}
      .flow{fill:none;stroke:#a7a5a1;stroke-width:1.3;marker-end:url(#a)}
      .branch{fill:none;stroke:#777672;stroke-width:1.2}
      .cohort{fill:none;stroke:#e9bd86;stroke-width:1.3;marker-end:url(#b)}
      .feedback{fill:none;stroke:#00dd94;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#g)}
    </style>
  </defs>
