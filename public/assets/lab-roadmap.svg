  <text class="lane amber" x="24" y="249" data-i18n="s040">(b) TEST A MARKET</text>
  <text class="muted" x="272" y="273" data-i18n="s070">Paired experiments</text>
  <rect class="node" x="24" y="291" width="180" height="100"/>
