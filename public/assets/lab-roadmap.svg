  <text class="muted" x="827" y="345" text-anchor="middle" data-i18n="s075">Depth · spread · churn</text>
  <text class="muted" x="827" y="369" text-anchor="middle" data-i18n="s076">Slippage · concentration</text>
  <path class="flow next" d="M920 341h45"/>
  <rect class="node next" x="965" y="291" width="211" height="100"/>
