<svg xmlns="http://www.w3.org/2000/svg" width="560" height="550" viewBox="0 0 560 550" role="img" aria-labelledby="title desc">
  <title id="title">Backer data flywheel</title>
  <desc id="desc">A proposed clockwise learning loop: observe context, simulate decisions, test market rules, record real actions, resolve external outcomes, and calibrate models before the next cycle. The center is a decision-to-outcome evidence record. This is a system architecture, not a claim of achieved predictive validity.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#e9bd86"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#f5f3ee;text-anchor:middle}
      .label{font-size:22px;font-weight:500}
      .number{font-size:16px;font-weight:600;fill:#e9bd86;letter-spacing:1px}
      .sub{font-size:18px;fill:#aba9a5}
      .foot{font-size:16px;fill:#aba9a5}
    </style>
  </defs>
  <circle cx="280" cy="245" r="244" fill="#08080a"/>
  <circle cx="280" cy="245" r="172" fill="none" stroke="#e9bd86" stroke-opacity=".13" stroke-width="1"/>

  <path d="M347.21 86.67 A172 172 0 0 1 383.51 107.63" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M450.72 224.04 A172 172 0 0 1 450.72 265.96" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M383.51 382.37 A172 172 0 0 1 347.21 403.33" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M212.79 403.33 A172 172 0 0 1 176.49 382.37" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M109.28 265.96 A172 172 0 0 1 109.28 224.04" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M176.49 107.63 A172 172 0 0 1 212.79 86.67" fill="none" stroke="#e9bd86" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="280" cy="245" r="88" fill="#15120e" stroke="#e9bd86" stroke-opacity=".5" stroke-width="1.2"/>
  <text x="280" y="213" font-size="24" fill="#f5f3ee">Decision</text>
  <text x="280" y="242" font-size="23" fill="#e9bd86">↓</text>
  <text x="280" y="271" font-size="24" fill="#f5f3ee">Outcome</text>
  <text x="280" y="302" font-size="17" fill="#aba9a5">Evidence record</text>
  <g aria-label="01 Observe context">
    <circle cx="280.00" cy="73.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="280.00" y="44.00" style="fill:#e9bd86">01</text>
    <text class="label" x="280.00" y="75.00" style="font-size:22px">Observe</text>
    <text class="label" x="280.00" y="100.00" style="font-size:22px">context</text>
  </g>
  <g aria-label="02 Simulate decisions">
    <circle cx="428.96" cy="159.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="428.96" y="130.00" style="fill:#e9bd86">02</text>
    <text class="label" x="428.96" y="161.00" style="font-size:22px">Simulate</text>
    <text class="label" x="428.96" y="186.00" style="font-size:22px">decisions</text>
  </g>
  <g aria-label="03 Test market rules">
    <circle cx="428.96" cy="331.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="428.96" y="302.00" style="fill:#e9bd86">03</text>
    <text class="label" x="428.96" y="333.00" style="font-size:22px">Test market</text>
    <text class="label" x="428.96" y="358.00" style="font-size:22px">rules</text>
  </g>
  <g aria-label="04 Record actions">
    <circle cx="280.00" cy="417.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="280.00" y="388.00" style="fill:#e9bd86">04</text>
    <text class="label" x="280.00" y="419.00" style="font-size:22px">Record</text>
    <text class="label" x="280.00" y="444.00" style="font-size:22px">actions</text>
  </g>
  <g aria-label="05 Resolve outcomes">
    <circle cx="131.04" cy="331.00" r="64" fill="#0b1a14" stroke="#00dd94" stroke-width="1.4"/>
    <text class="number" x="131.04" y="302.00" style="fill:#00dd94">05</text>
    <text class="label" x="131.04" y="333.00" style="font-size:22px">Resolve</text>
    <text class="label" x="131.04" y="358.00" style="font-size:22px">outcomes</text>
  </g>
  <g aria-label="06 Calibrate models">
    <circle cx="131.04" cy="159.00" r="64" fill="#15120e" stroke="#e9bd86" stroke-width="1.4"/>
    <text class="number" x="131.04" y="130.00" style="fill:#e9bd86">06</text>
    <text class="label" x="131.04" y="161.00" style="font-size:22px">Calibrate</text>
    <text class="label" x="131.04" y="186.00" style="font-size:22px">models</text>
  </g>
  <text class="foot" x="280" y="510">Proposed loop · external outcomes govern learning.</text>
  <text class="foot" x="280" y="533">Synthetic activity alone is not new evidence.</text>
</svg>
